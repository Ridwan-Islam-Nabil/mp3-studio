name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (lint, build, unit, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mp3-studio-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mp3-studio-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Type-check tests
        run: npx tsc --noEmit -p tsconfig.test.json
      - run: npm test

      # Firefox and WebKit run here (Linux) because Playwright's Windows builds can't run
      # the editor: WebKit on Windows has no Web Audio / MP3 playback (see CLAUDE.md → Tests).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Playwright smoke test (Chromium, Firefox, WebKit)
        run: npm run test:e2e

      # TEMPORARY evidence for the COOP/COEP decision (CLAUDE.md → "The COOP/COEP headers"):
      # rebuild without the two headers and rerun the suite. Read the `[coi]` lines in the log.
      # Non-blocking; delete this step once the headers are kept or removed for good.
      - name: COOP/COEP experiment (headers off, non-blocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          DISABLE_COI: "1"
        run: npm run build && npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            mp3-studio-web/playwright-report/
            mp3-studio-web/test-results/
          retention-days: 7

  local:
    name: Local Flask app (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest
