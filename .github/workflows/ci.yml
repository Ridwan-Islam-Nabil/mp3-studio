name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (lint, build, unit, e2e)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 from 2026-10-19; bump deliberately
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mp3-studio-web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24  # bundles npm 11, matching the npm that writes package-lock.json
          cache: npm
          cache-dependency-path: mp3-studio-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Type-check tests
        run: npx tsc --noEmit -p tsconfig.test.json
      - run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke test
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            mp3-studio-web/playwright-report/
            mp3-studio-web/test-results/
          if-no-files-found: ignore  # nothing to upload when an earlier step fails
          retention-days: 7

  local:
    name: Local Flask app (pytest)
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 from 2026-10-19; bump deliberately
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest
